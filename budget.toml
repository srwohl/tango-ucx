# Phase 5 adds GPU source, opaque GPU receive and pinned host upload (NEXT.md).
# Allowances also catch up completed pull and installed-consumer work measured before this build.
# Pre-build counts were 6,099 library and 5,577 test lines, with 80 C++ and 33 Python names.
# The estimates come from prototypes/final_shape/fixed_tables_v2.md, section 10.
# Phase 1 and 2 category splits were rebalanced from measured counts; combined totals stay cumulative.
# Phase 3 allowances were raised to the measured counts when the phase was closed (2026-10-02).
# Phase 4 is detector-native opaque payloads (NEXT.md). Its library figures are the scoping
# study's estimates, and the library came in under them. Its test figures were raised to the
# measured counts where the tests went over: the packed ring's tests were not scoped.
# The 10,000-line ceiling of the specification no longer binds (NEXT.md, "Decisions taken").
# A packed ring's frame states its position (NEXT.md, "Header order"): the tables, wire and
# test allowances were raised to the measured counts for it. The phase total is the sum of
# its allowances; the measured combined count stays under the ceiling.
# Per-file entries are allowances, not targets.

