[workspace]
name = "tango-ucx"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.55"

[dependencies]
cmake = "*"
ninja = "*"
clang-format = "*"
cxx-compiler = "*"
cpptango = ">=10.0"
cppzmq = "*"
ucx = ">=1.21"
catch2 = ">=3.1.1"
python = ">=3.11"
pytango = ">=10.0"
pybind11 = ">=3.1,<4"
pytest = ">=8"
numpy = "*"
dlpack = "*"
nlohmann_json = ">=3.12"

[feature.gpu.dependencies]
cuda-version = "12.9.*"
cuda-cudart-dev = "*"
cuda-nvcc = "*"
cupy = ">=14"

# The gpu environment resolves its own compiler and packages, so it builds in its own tree.
[feature.gpu.tasks]
_configure-gpu = { cmd = "cmake $CMAKE_ARGS -GNinja -S . -B build-gpu -DBUILD_TESTING=ON -DTANGO_UCX_CUDA=ON" }
build-gpu = { cmd = "cmake --build build-gpu", depends-on = ["_configure-gpu"] }
test-gpu = { cmd = "ctest --test-dir build-gpu -L gpu --no-tests=error --output-on-failure", depends-on = ["build-gpu"] }

[environments]
default = ["default"]
gpu = ["default", "gpu"]

[tasks]
configure = { cmd = "cmake $CMAKE_ARGS -GNinja -S . -B build -DBUILD_TESTING=ON" }
build = { cmd = "cmake --build build", depends-on = ["configure"] }
test = { cmd = "ctest --test-dir build -L 'unit|ucx|tango|python' --output-on-failure", depends-on = ["build"] }
test-python = { cmd = "PYTHONPATH=build/python TANGO_UCX_FIXTURE_DEVICE=build/tests/fixture_device pytest python/tests", depends-on = ["build"] }
_configure-asan = { cmd = "cmake $CMAKE_ARGS -GNinja -S . -B build-asan -DBUILD_TESTING=ON -DTANGO_UCX_SANITIZERS=address,undefined" }
_build-asan = { cmd = "cmake --build build-asan", depends-on = ["_configure-asan"] }
test-asan = { cmd = "ctest --test-dir build-asan --output-on-failure", depends-on = ["_build-asan"] }
_configure-tsan = { cmd = "cmake $CMAKE_ARGS -GNinja -S . -B build-tsan -DBUILD_TESTING=ON -DTANGO_UCX_SANITIZERS=thread" }
_build-tsan = { cmd = "cmake --build build-tsan", depends-on = ["_configure-tsan"] }
# The fork tests start threads in the child, and TSan's process_vm_readv interceptor faults in
# UCX's CMA reachability probe, so CMA is left out. Python is not run: it is not instrumented.
test-tsan = { cmd = "ctest --test-dir build-tsan -L 'unit|ucx|tango' --output-on-failure", depends-on = ["_build-tsan"], env = { TSAN_OPTIONS = "die_after_fork=0 second_deadlock_stack=1", UCX_TLS = "^cma" } }
check = "python tools/check.py"
count = "python tools/count.py"
